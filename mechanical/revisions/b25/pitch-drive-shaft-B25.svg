<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720"
     role="img" aria-labelledby="title description">
  <title id="title">R5 B25 right neck pitch shaft machining drawing</title>
  <desc id="description">The 27.30 mm long, 8 mm h7 steel shaft has a motor-end flat 9.95 mm long and 1.00 mm deep.
    Drill the 2.50 mm through pilot normal to the flat at 7.20 mm from the motor end, then tap M3 by 0.5 through.
    Drill the 3.00 mm frame pin through hole 5.50 mm from the outer end, also normal to the flat.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse"
            markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,3 L 0,6 Z" fill="#454e58"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #151b23; }
      .heading { font-size: 26px; font-weight: 700; }
      .note { font-size: 15px; }
      .view { font-size: 14px; font-weight: 700; }
      .outline, .hidden, .axis, .extension, .dimension, .leader { fill: none; }
      .outline { stroke: #151b23; stroke-width: 2.4; }
      .hidden { stroke: #454e58; stroke-width: 1.2; stroke-dasharray: 7 5; }
      .axis { stroke: #656e7a; stroke-width: 1; stroke-dasharray: 14 4 3 4; }
      .extension, .dimension, .leader { stroke: #454e58; stroke-width: 1.2; }
      .dimension { marker-start: url(#arrow); marker-end: url(#arrow); }
      .leader { marker-end: url(#arrow); }
      .measure { font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <path d="M 1,1 H 1039 V 719 H 1 Z" fill="#fff" stroke="#c0c7ce"/>
  <text x="34" y="43" class="heading">R5 B25 · Right neck pitch shaft</text>
  <text x="34" y="70" class="note">S45C or equivalent machinable steel · Dimensions in mm</text>
  <path class="extension" d="M 34,89 H 1006 M 34,647 H 1006"/>

  <!-- These orthographic views use the same 22 px/mm scale. -->
  <text x="35" y="242" class="view">TOP VIEW</text>
  <g class="outline">
    <rect x="174" y="170" width="600.6" height="176"/>
    <path d="M 174,199.7935 H 392.9 V 316.2065 H 174"/>
    <circle cx="332.4" cy="258" r="27.5"/>
    <circle cx="653.6" cy="258" r="33"/>
  </g>
  <path class="axis" d="M 161,258 H 788 M 332.4,223 V 293 M 653.6,218 V 298"/>

  <path class="extension" d="M 174,164 V 109 M 774.6,164 V 109"/>
  <path class="dimension" d="M 174,119 H 774.6"/>
  <text x="474.3" y="112" text-anchor="middle" class="measure">27.30</text>

  <path class="leader" d="M 783,137 H 362 L 342.6,232.5"/>
  <text x="792" y="134" class="measure">Ø2.50 drill through</text>
  <text x="792" y="155" class="measure">M3×0.5 tap through</text>
  <path class="leader" d="M 783,198 H 724 L 677,234.7"/>
  <text x="792" y="195" class="measure">Ø3.00 through</text>
  <text x="792" y="216" class="note">Frame pin</text>

  <path class="extension" d="M 174,351 V 410 M 332.4,350 V 384 M 392.9,351 V 410
                               M 653.6,350 V 384 M 774.6,351 V 384"/>
  <path class="axis" d="M 332.4,295 V 350 M 653.6,300 V 350"/>
  <path class="dimension" d="M 174,376 H 332.4"/>
  <path class="dimension" d="M 653.6,376 H 774.6"/>
  <path class="dimension" d="M 174,402 H 392.9"/>
  <text x="253.2" y="370" text-anchor="middle" class="measure">7.20</text>
  <text x="714.1" y="370" text-anchor="middle" class="measure">5.50</text>
  <text x="283.45" y="396" text-anchor="middle" class="measure">9.95</text>
  <text x="174" y="430" class="note">Motor end</text>
  <text x="774.6" y="430" text-anchor="end" class="note">Outer end</text>

  <text x="35" y="533" class="view">SIDE VIEW</text>
  <path class="outline" d="M 174,471 H 392.9 V 449 H 774.6 V 625 H 174 Z"/>
  <path class="hidden" d="M 304.9,473 V 625 M 359.9,473 V 625 M 620.6,451 V 625 M 686.6,451 V 625"/>
  <path class="axis" d="M 160,537 H 787 M 332.4,461 V 634 M 653.6,439 V 634"/>
  <path class="extension" d="M 392.9,449 H 132 M 170,471 H 132 M 781,449 H 819 M 781,625 H 819"/>
  <path class="dimension" d="M 139,449 V 471"/>
  <path class="dimension" d="M 812,449 V 625"/>
  <text x="131" y="465" text-anchor="end" class="measure">1.00</text>
  <text x="824" y="543" class="measure">Ø8 h7</text>

  <text x="34" y="675" class="note">Both holes are normal to the motor-end flat. Remove burrs from the holes.</text>
  <text x="34" y="698" class="note">The fabrication STEP shows the shaft after drilling and before tapping.</text>
</svg>
